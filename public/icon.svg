<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" stroke="#38bdf8" stroke-width="8" opacity="0.3" />
  
  <!-- Play Circle -->
  <circle cx="256" cy="270" r="110" fill="#0f172a" stroke="#38bdf8" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Play Triangle -->
  <polygon points="230,210 320,270 230,330" fill="#38bdf8" />
  
  <!-- Graduation Cap Top -->
  <path d="M140 160 L256 110 L372 160 L256 210 Z" fill="#fbbf24" stroke="#d97706" stroke-width="6"/>
  <!-- Tassel -->
  <path d="M360 160 Q380 200 375 230" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="375" cy="235" r="10" fill="#d97706" />
</svg>
